<!DOCTYPE html>
<html>
<head>
    <title>Intelligent Waste Management Agent</title>
    <style>
        body {
            background: #0f172a; /* deep slate */
            color: #e5e7eb;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            color: #a78bfa;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #4f46e5;
        }

        .card {
            background: #020617;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(99,102,241,0.2);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 6px 0;
        }

        .decision {
            font-size: 18px;
            color: #22d3ee;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>♻️ Intelligent Waste Management Agent</h1>

    <form method="POST">
        <button type="submit">🔍 Sense Environment</button>
    </form>

    {% if data %}
    <div class="card">
        <h3>📡 Sensor Data</h3>
        <ul>
            <li> Waste Level: {{ data.waste_level }}%</li>
            <li> Waste Type: {{ data.waste_type }}</li>
            <li> Location Priority: {{ data.location_priority }}</li>
            <li> Weather: {{ data.weather_condition }}</li>
        </ul>

        <h3>🧠 Decision</h3>
        <p class="decision">{{ decision }}</p>
    </div>
    {% endif %}

    <br>
    <a href="/logs">📊 View Logs</a>

</body>
</html>
